<!DOCTYPE html>
<html lang="ru" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Угадай сленг — Mobile App</title>
    <!-- Tailwind CSS CDN -->
    <link href="app.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile Container Viewport Fitting */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100dvh;
            max-height: 920px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 27, 75, 0.98) 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 0px;
            overflow: hidden;
        }

        @media (min-height: 600px) and (min-width: 450px) {
            .app-container {
                height: 92dvh;
                border-radius: 36px;
                border: 1px solid rgba(255, 255, 255, 0.12);
            }
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
        }

        /* Button Press Feedback */
        .touch-btn {
            transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .touch-btn:active {
            transform: scale(0.96);
        }

        .opt-correct {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.25) 0%, rgba(16, 185, 129, 0.35) 100%) !important;
            border-color: #22c55e !important;
            color: #86efac !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .opt-wrong {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(225, 29, 72, 0.35) 100%) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
        }

        /* Keyframe Animations */
        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes firePulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.6)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.9)); }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-streak {
            animation: firePulse 1.2s infinite ease-in-out;
        }

        /* Hide Scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Top Phone Notch/Header Bar -->
        <header class="pt-4 px-6 pb-3 flex items-center justify-between border-b border-white/10 relative z-10 flex-shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-black text-white text-sm shadow-lg shadow-indigo-500/30">
                    🗣️
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-white leading-none">Сленг IQ</h1>
                    <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Мобильная Викторина</span>
                </div>
            </div>

            <!-- Streak Badge -->
            <div id="streak-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 font-extrabold text-xs">
                <span class="animate-streak">🔥</span>
                <span id="streak-count">0</span>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-5 flex flex-col justify-between relative">

            <!-- SCREEN 1: QUIZ GAME -->
            <div id="quiz-view" class="flex-1 flex flex-col justify-between space-y-4">

                <!-- Progress Header -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-400">
                        <span id="question-step" class="text-indigo-400">Вопрос 1 из 15</span>
                        <div class="flex items-center gap-1 text-slate-300">
                            <span>Счёт:</span>
                            <span id="score-val" class="text-amber-400 text-sm font-black">0</span>
                        </div>
                    </div>

                    <!-- Progress Bar Track -->
                    <div class="w-full h-2.5 bg-slate-900/80 rounded-full p-0.5 border border-white/10 overflow-hidden">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <!-- Word Card -->
                <div class="glass-card rounded-2xl p-6 text-center my-auto relative overflow-hidden shadow-xl border border-white/15">
                    <div class="absolute -top-10 -right-10 w-24 h-24 bg-indigo-500/20 rounded-full blur-xl pointer-events-none"></div>
                    <span class="text-[11px] font-bold uppercase tracking-widest text-indigo-300/80 block mb-2">Значение термина</span>
                    <h2 id="target-word" class="text-3xl sm:text-4xl font-black text-white tracking-wide drop-shadow-md">...</h2>
                </div>

                <!-- Options Grid -->
                <div id="options-container" class="grid gap-2.5 my-auto">
                    <!-- Options injected via JS -->
                </div>

                <!-- Interactive Explanation/Context Box -->
                <div id="explanation-box" class="hidden glass-panel rounded-2xl p-4 border-l-4 animate-pop space-y-1.5">
                    <div id="expl-title" class="font-extrabold text-sm flex items-center gap-2"></div>
                    <p id="expl-text" class="text-xs text-slate-300 leading-relaxed"></p>
                    <div class="mt-2 pt-2 border-t border-white/10 text-[11px] text-indigo-200/90 italic bg-indigo-950/40 p-2.5 rounded-xl">
                        <span class="font-bold not-italic text-indigo-300 block mb-0.5">💬 В контексте:</span>
                        <span id="expl-example"></span>
                    </div>
                </div>

                <!-- Action Button Container -->
                <div class="pt-2">
                    <button id="next-btn" class="touch-btn w-full py-4 rounded-2xl font-extrabold text-sm uppercase tracking-wider text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 shadow-lg shadow-indigo-600/30 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none" disabled>
                        Дальше
                    </button>
                </div>
            </div>

            <!-- SCREEN 2: GAME OVER / RESULT SCREEN -->
            <div id="result-view" class="hidden flex-1 flex flex-col justify-between items-center text-center py-4 animate-pop space-y-5">
                
                <div class="my-auto space-y-4 w-full">
                    <!-- Rank Badge -->
                    <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 border border-indigo-500/30 flex items-center justify-center text-5xl mx-auto shadow-2xl shadow-indigo-500/20 relative">
                        <span id="rank-emoji">🗿</span>
                        <div class="absolute -bottom-2 px-3 py-0.5 bg-indigo-600 text-[10px] font-black uppercase rounded-full tracking-wider text-white">Ранг</div>
                    </div>

                    <div>
                        <h2 id="rank-title" class="text-2xl font-black text-white mb-1">...</h2>
                        <p id="rank-desc" class="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed"></p>
                    </div>

                    <!-- Statistics Cards Grid -->
                    <div class="grid grid-cols-2 gap-3 w-full pt-2">
                        <div class="glass-card p-4 rounded-2xl border border-white/10">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Очки</span>
                            <span id="res-score" class="text-2xl font-black text-amber-400">0</span>
                        </div>
                        <div class="glass-card p-4 rounded-2xl border border-white/10">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Точность</span>
                            <span id="res-accuracy" class="text-2xl font-black text-emerald-400">0%</span>
                        </div>
                        <div class="glass-card p-4 rounded-2xl border border-white/10 col-span-2">
                            <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Макс. комбо streak</span>
                            <span id="res-max-streak" class="text-xl font-black text-orange-400 flex items-center justify-center gap-1">
                                0 🔥
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Restart Action Button -->
                <button id="restart-btn" class="touch-btn w-full py-4 rounded-2xl font-extrabold text-sm uppercase tracking-wider text-white bg-gradient-to-r from-indigo-600 to-purple-600 shadow-lg shadow-indigo-600/30">
                    Сыграть ещё раз 🔄
                </button>
            </div>

        </main>
    </div>

    <script>
        /* Slang Knowledge Base */
        const SLANG_DATABASE = [
            {
                word: "Кринж",
                correct: "Чувство неловкости, стыда или смущения",
                wrong: ["Чувство огромного восторга", "Усталость после рабочей недели"],
                example: "«Посмотреть свои старые видео 5-летней давности — это такой кринж!»"
            },
            {
                word: "Вайб",
                correct: "Особая атмосфера, настроение или ощущение",
                wrong: ["Технический сбой в приложении", "Таинственное послание в чате"],
                example: "«В этой кофейне у окна просто потрясающий осенний вайб.»"
            },
            {
                word: "Краш",
                correct: "Человек, который безумно нравится",
                wrong: ["Главный соперник в компьютерной игре", "Автор популярного видеоролика"],
                example: "«Кажется, новый парень из параллельного класса — мой настоящий краш.»"
            },
            {
                word: "Жиза",
                correct: "Очень знакомая жизненная ситуация",
                wrong: ["Выдуманная история для соцсетей", "Случайная победа в турнире"],
                example: "«Забыл наушники дома и весь день ходишь в тишине — ох, чистая жиза!»"
            },
            {
                word: "Имба",
                correct: "Что-то слишком мощное, превосходящее аналоги",
                wrong: ["Грамматическая ошибка в тексте", "Скучный и затянутый сюжет"],
                example: "«Эта новая стратегия в игре — абсолютная имба, побеждаю всех подряд!»"
            },
            {
                word: "Рофл",
                correct: "Прикол, шутка или смешная ситуация",
                wrong: ["Громкий конфликт на публике", "Серьёзное обещание"],
                example: "«Да не принимай близко к сердцу, я сказал это чисто ради рофла!»"
            },
            {
                word: "Тильт",
                correct: "Раздражение и злость из-за серии неудач",
                wrong: ["Вирусный видеоролик в трендах", "Спокойное приятное общение"],
                example: "«Проиграл три матча подряд и впал в жесткий тильт.»"
            },
            {
                word: "Редфлаг",
                correct: "Тревожный признак скрытой проблемы или опасности",
                wrong: ["Символ полного доверия и дружбы", "Игровая коллекционная награда"],
                example: "«Если человек постоянно перебивает и не слушает — это явный редфлаг.»"
            },
            {
                word: "Забанить",
                correct: "Заблокировать доступ пользователю",
                wrong: ["Отправить приглашение в друзья", "Оставить положительный отзыв"],
                example: "«Модератору пришлось забанить спамера за рекламу в чате.»"
            },
            {
                word: "Заскринить",
                correct: "Сделать снимок экрана (скриншот)",
                wrong: ["Записать голосовое сообщение", "Безвозвратно удалить файл"],
                example: "«Заскринь этот рецепт, чтобы не потерять его позже!»"
            },
            {
                word: "Скилл",
                correct: "Умение, навык или профессионализм",
                wrong: ["Случайная ошибка в программе", "Виртуальный игровой предмет"],
                example: "«Чтобы красиво делать такой видеомонтаж, нужен хороший скилл.»"
            },
            {
                word: "Нуб",
                correct: "Неопытный новичок в каком-то деле",
                wrong: ["Титулованный чемпион турнира", "Создатель мобильной игры"],
                example: "«Я пока нуб в шахматах, только вчера выучил как ходят фигуры.»"
            },
            {
                word: "Флексить",
                correct: "Показывать себя, хвастаться чем-то",
                wrong: ["Быстро удалять старые переписки", "Незаметно уходить с встречи"],
                example: "«Он пришел в новых кроссовках и весь вечер флексил перед друзьями.»"
            },
            {
                word: "Муд",
                correct: "Текущее эмоциональное состояние и настроение",
                wrong: ["Картинка в профиле соцсетей", "Компьютерная программа для музыки"],
                example: "«Лежать под теплым пледом с чашкой какао — мой муд на эти выходные.»"
            },
            {
                word: "Токсик",
                correct: "Человек, отравляющий атмосферу своими негативами",
                wrong: ["Очень популярный и жизнерадостный человек", "Скромный молчаливый собеседник"],
                example: "«Старайся меньше общаться с этим токсиком, он только портит настроение.»"
            }
        ];

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            play(type) {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'correct') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523.25, now); // C5
                        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                    } else if (type === 'wrong') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, now); // A3
                        osc.frequency.linearRampToValueAtTime(140, now + 0.18);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                    } else if (type === 'streak') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(587.33, now); // D5
                        osc.frequency.setValueAtTime(880, now + 0.08); // A5
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'finish') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(554.37, now + 0.1);
                        osc.frequency.setValueAtTime(659.25, now + 0.2);
                        osc.frequency.setValueAtTime(880, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                    }
                } catch (e) {
                    console.error("Audio playback error:", e);
                }
            }
        }

        const audio = new SoundFX();

        /* Haptic Vibration Helper */
        function triggerHaptic(type) {
            if (!("vibrate" in navigator)) return;
            if (type === 'correct') navigator.vibrate(40);
            else if (type === 'wrong') navigator.vibrate([60, 40, 60]);
            else if (type === 'streak') navigator.vibrate([30, 30, 50]);
        }

        const LABELS = ['А', 'Б', 'В'];
        let gameDeck = [];
        let curIdx = 0;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let answered = false;

        // DOM elements cache
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        const questionStep = document.getElementById('question-step');
        const scoreVal = document.getElementById('score-val');
        const streakCount = document.getElementById('streak-count');
        const progressBar = document.getElementById('progress-bar');
        const targetWord = document.getElementById('target-word');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const explTitle = document.getElementById('expl-title');
        const explText = document.getElementById('expl-text');
        const explExample = document.getElementById('expl-example');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            gameDeck = shuffle(SLANG_DATABASE).map(item => ({
                ...item,
                options: shuffle([item.correct, ...item.wrong])
            }));
            curIdx = 0;
            score = 0;
            streak = 0;
            maxStreak = 0;

            scoreVal.textContent = '0';
            streakCount.textContent = '0';

            quizView.classList.remove('hidden');
            resultView.classList.add('hidden');

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            answered = false;
            nextBtn.disabled = true;
            explanationBox.classList.add('hidden');

            const q = gameDeck[curIdx];
            const total = gameDeck.length;
            const progress = (curIdx / total) * 100;

            questionStep.textContent = `Вопрос ${curIdx + 1} из ${total}`;
            progressBar.style.width = `${progress}%`;
            targetWord.textContent = q.word;

            optionsContainer.innerHTML = '';
            q.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'touch-btn w-full text-left p-3.5 sm:p-4 rounded-2xl glass-card text-slate-100 font-semibold text-xs sm:text-sm flex items-center gap-3 border border-white/10';
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-xl bg-white/10 flex items-center justify-center font-extrabold text-xs text-indigo-300 flex-shrink-0">${LABELS[i]}</span>
                    <span class="leading-snug">${optText}</span>
                `;
                btn.onclick = () => handleAnswer(optText, btn, q);
                optionsContainer.appendChild(btn);
            });

            nextBtn.textContent = curIdx === total - 1 ? 'Завершить' : 'Дальше';
        }

        function handleAnswer(selectedOpt, btnEl, qData) {
            if (answered) return;
            answered = true;

            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(b => b.disabled = true);

            // Highlight Correct Answer
            allButtons.forEach(b => {
                const text = b.querySelector('span:last-child').textContent;
                if (text === qData.correct) {
                    b.classList.add('opt-correct');
                }
            });

            if (selectedOpt === qData.correct) {
                score++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;

                scoreVal.textContent = score;
                streakCount.textContent = streak;

                if (streak >= 3) {
                    audio.play('streak');
                    triggerHaptic('streak');
                } else {
                    audio.play('correct');
                    triggerHaptic('correct');
                }

                explTitle.className = 'font-extrabold text-sm flex items-center gap-1.5 text-emerald-400';
                explTitle.innerHTML = '<span>✅</span><span>Идеально!</span>';
                explText.textContent = qData.correct + '.';
                explanationBox.className = 'glass-panel rounded-2xl p-3.5 border-l-4 border-emerald-500 bg-emerald-950/20 animate-pop space-y-1';
            } else {
                streak = 0;
                streakCount.textContent = '0';
                btnEl.classList.add('opt-wrong');

                audio.play('wrong');
                triggerHaptic('wrong');

                explTitle.className = 'font-extrabold text-sm flex items-center gap-1.5 text-rose-400';
                explTitle.innerHTML = '<span>❌</span><span>Ошибочка</span>';
                explText.textContent = `Правильно: ${qData.correct}.`;
                explanationBox.className = 'glass-panel rounded-2xl p-3.5 border-l-4 border-rose-500 bg-rose-950/20 animate-pop space-y-1';
            }

            explExample.textContent = qData.example;
            explanationBox.classList.remove('hidden');
            nextBtn.disabled = false;
        }

        nextBtn.onclick = () => {
            if (!answered) return;
            if (curIdx < gameDeck.length - 1) {
                curIdx++;
                renderCurrentQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            audio.play('finish');
            triggerHaptic('streak');

            quizView.classList.add('hidden');
            resultView.classList.remove('hidden');

            const total = gameDeck.length;
            const accuracy = Math.round((score / total) * 100);

            document.getElementById('res-score').textContent = `${score} / ${total}`;
            document.getElementById('res-accuracy').textContent = `${accuracy}%`;
            document.getElementById('res-max-streak').textContent = `${maxStreak} 🔥`;

            let emoji = '🦖';
            let title = 'Древний динозавр';
            let desc = 'Сленг — не ваша сильная сторона, но никогда не поздно подтянуть молодежный лексикон!';

            if (accuracy >= 90) {
                emoji = '🗿';
                title = 'Легенда сленга';
                desc = 'Вы абсолютно в теме! Никакой кринж не проскочит мимо вас. Полный флекс знаниями!';
            } else if (accuracy >= 70) {
                emoji = '✨';
                title = 'Краш сленга';
                desc = 'Вы отлично разбираетесь в трендах и без труда поймете любой современный чат.';
            } else if (accuracy >= 40) {
                emoji = '👍';
                title = 'Нормис';
                desc = 'Базовые понятия вам знакомы, но некоторые редкие термины пока вызывают вопросы.';
            }

            document.getElementById('rank-emoji').textContent = emoji;
            document.getElementById('rank-title').textContent = title;
            document.getElementById('rank-desc').textContent = desc;
        }

        restartBtn.onclick = initGame;

        // Initialize game on load
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
